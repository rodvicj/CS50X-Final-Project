{% extends "vaccination_records/layout.html" %}

{% block body %}
  <div class="login__container">
    <h2 class="login__title">Login</h2>

    {% if message %}<div>{{ message }}</div>{% endif %}

    <form class="login__form"
          action="{% url 'vaccination_records:login' %}"
          method="post">
      {% csrf_token %}
      <div class="form-group">
        <input autofocus
               class="form-control"
               type="email"
               name="email"
               placeholder="Email" />
      </div>
      <div class="form-group">
        <input class="form-control"
               type="password"
               name="password"
               placeholder="Password" />
      </div>
      <input class="login__form--btn" type="submit" value="Login" />
    </form>

    <p class="login__cta">Don't have an account?</p>
    <a href="{% url 'vaccination_records:register' %}">Register here.</a>
  </div>
{% endblock %}
